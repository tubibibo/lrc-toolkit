name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, test & package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Layering guardrail
        run: npm run check:layering

      - name: Format check
        run: npm run format:check

      - name: Unit tests with coverage gate
        run: npm test

      - name: Bundle
        run: npm run compile

      - name: Adapter smoke test
        run: npm run smoke

      - name: Package extension
        run: npm run package

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: lrc-toolkit-vsix-node${{ matrix.node }}
          path: "*.vsix"
