version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # These require Node >= 22; the project keeps a Node 20 baseline.
      - dependency-name: vitest
        versions: ["5.x"]
      - dependency-name: "@vitest/coverage-v8"
        versions: ["5.x"]
      - dependency-name: "@vscode/vsce"
        versions: ["4.x"]
      # TS 7 breaks typescript-eslint 8 (ERESOLVE); revisit when the peer
      # range widens.
      - dependency-name: typescript
        versions: ["7.x"]
      # Node 20 is the baseline; newer typings would typecheck against APIs
      # the runtime does not have.
      - dependency-name: "@types/node"
        versions: [">=21.0.0"]
      # Must track engines.vscode (^1.85.0).
      - dependency-name: "@types/vscode"
        versions: [">=1.86.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
